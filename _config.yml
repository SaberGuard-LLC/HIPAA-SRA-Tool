title: SaberGuard SRA Workspace
description: A browser workspace for documenting a HIPAA Security Rule risk analysis. Not the HHS SRA Tool and not a replacement for it.
remote_theme: just-the-docs/just-the-docs@v0.10.1
url: https://saberguard-llc.github.io
baseurl: /HIPAA-SRA-Tool
logo: /SaberGuard_1.png
permalink: pretty

color_scheme: light

aux_links:
  Open the workspace:
    - https://saberguard-llc.github.io/HIPAA-SRA-Tool/
  GitHub:
    - https://github.com/SaberGuard-LLC/HIPAA-SRA-Tool

aux_links_new_tab: false

heading_anchors: true

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Take care
    color: yellow

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/SaberGuard-LLC/HIPAA-SRA-Tool
gh_edit_branch: main
gh_edit_view_mode: tree

footer_content: 'Published by SaberGuard LLC. Code is MIT licensed. Not the HHS Security Risk Assessment (SRA) Tool, and not affiliated with or endorsed by HHS, OCR, or ONC. Not legal advice.'

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - tests/
  - scripts/
  - package.json
  - package-lock.json
  - vercel.json
  - README.md
  - CHANGELOG.md
  - SECURITY.md
  - VERIFICATION.md
  - LICENSE

defaults:
  - scope:
      path: docs
      type: pages
    values:
      layout: default
