# Dependabot configuration for Saberguard
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Root directory of your project
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    # Specify the branch to target, matching your CodeQL and main development branch.
    target-branch: "main"
