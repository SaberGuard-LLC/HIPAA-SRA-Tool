name: Release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, for example v4.2.0"
        required: true
      ref:
        description: "Commit or branch to tag"
        required: true
        default: main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish a GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "package.json says $version, the tag is $TAG"
            exit 1
          fi
      - name: Text lint and tests
        run: npm run check
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Package the workspace
        run: |
          name="saberguard-sra-workspace-${TAG}"
          mkdir -p "dist/$name"
          cp -R index.html assets samples LICENSE "dist/$name/"
          for f in SaberGuard_1.png favicon.png favicon.svg; do
            if [ -f "$f" ]; then cp "$f" "dist/$name/"; fi
          done
          (cd dist && zip -qr "$name.zip" "$name")
          (cd dist && sha256sum "$name.zip" > SHA256SUMS)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha="$(git rev-parse HEAD)"
          gh release create "$TAG" \
            --target "$sha" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "dist/saberguard-sra-workspace-${TAG}.zip" \
            dist/SHA256SUMS
