name: Scanner pins

on:
  schedule:
    - cron: '41 7 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check scanner pins against upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Compare the Semgrep, gitleaks and actionlint pins with their latest releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/scanner-pins.mjs
